<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760">
<rect width="1000" height="760" rx="22" fill="#f5f7fb"/>
<g font-family="Arial, sans-serif" fill="#17263d">
<text x="45" y="48" font-size="29" font-weight="700">Diagonal track: same idea, both coordinates contribute</text>
<text x="45" y="80" font-size="19" fill="#526077">All coordinates and distances are in metres. Diagram drawn to scale.</text>
<path d="M140 500 L620 500 L620 140" fill="none" stroke="#b9c3cf" stroke-width="2" stroke-dasharray="7 7"/>
<text x="350" y="535" font-size="20" fill="#526077">80 m east</text>
<text x="650" y="330" font-size="20" fill="#526077">60 m north</text>
<line x1="140" y1="500" x2="620" y2="140" stroke="#526077" stroke-width="8" stroke-linecap="round"/>
<line x1="140" y1="500" x2="332" y2="356" stroke="#008b83" stroke-width="9"/>
<line x1="140" y1="500" x2="260" y2="260" stroke="#9766ce" stroke-width="3"/>
<line x1="260" y1="260" x2="332" y2="356" stroke="#d78b20" stroke-width="4" stroke-dasharray="8 6"/>
<path d="M321.2 341.6 L335.6 330.8 L346.4 345.2" fill="none" stroke="#b87518" stroke-width="2"/>
<circle cx="140" cy="500" r="9" fill="#17263d"/><circle cx="620" cy="140" r="9" fill="#17263d"/>
<circle cx="260" cy="260" r="10" fill="#9766ce"/><circle cx="332" cy="356" r="10" fill="#008b83"/>
<text x="45" y="491" font-size="22" font-weight="700">A (0, 0)</text>
<text x="635" y="142" font-size="22" font-weight="700">B (80, 60)</text>
<text x="75" y="211" font-size="22" font-weight="700" fill="#7843b3">P (20, 40)</text>
<text x="75" y="238" font-size="18" fill="#7843b3">Your GPS position</text>
<text x="355" y="380" font-size="22" font-weight="700" fill="#008b83">Q (32, 24)</text>
<text x="355" y="407" font-size="18" fill="#008b83">Closest point on track</text>
<text x="310" y="276" font-size="19" fill="#a66000">20 m off track</text>
<text x="199" y="463" font-size="19" fill="#008b83">40 m along track</text>
<text x="450" y="195" font-size="19" fill="#526077" transform="rotate(-36.87 450 195)">Track length = 100 m</text>
<rect x="45" y="570" width="910" height="155" rx="16" fill="#e3efed"/>
<text x="70" y="606" font-size="23">t = (20 × 80 + 40 × 60) / (80² + 60²)</text>
<text x="70" y="646" font-size="23">t = 4,000 / 10,000 = 0.40 → 40% along the track</text>
<text x="70" y="689" font-size="23" font-weight="700" fill="#00756f">Q = (0, 0) + 0.40 × (80, 60) = (32, 24)</text>
</g></svg>
