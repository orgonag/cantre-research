name: Deploy to GitHub Pages

# Manual only (controller ruling P10). Nothing deploys on a push. After the owner has enabled
# Pages (Settings > Pages > Source: GitHub Actions) and run this once with a good result, a
# push-to-main trigger is a later one-line change: add
#   push:
#     branches: [main]
# under `on:`. That change needs the owner's explicit go-ahead, like enabling Pages itself.
#
# What the build job does, in order: restore the raw source cache, download and hash-check every
# registered NRWN province and the Transport Canada inventory, build the national snapshot, build
# the app for the /cantre-research/ sub-path, lay the data out as the site's data/ folder, run the
# size gate, and upload the site. The deploy job publishes it and then checks that the host does
# not add Content-Encoding to the .gz data files.
#
# Data stays under each source's own licence (docs/DATA-LICENSES.md). Tiles are built and
# size-checked but are not published.

on:
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a started deployment is never cancelled half way.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CANTRE_RAW_DIR: ${{ github.workspace }}/.cache/raw

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: npm ci
      - run: pip install -e pipeline
      # A different key prefix from the CI pipeline job, which caches only Saskatchewan and the
      # inventory under "raw-<hash>"; sharing that key would restore a cache with 2 of 12 sources.
      - name: Restore the raw source cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/raw
          key: raw-national-${{ hashFiles('pipeline/sources/*.json') }}
      # Each acquire retries a timeout or connection failure up to 5 times (waits 1, 2, 4, 8 s)
      # and fails with HASH_MISMATCH unless the bytes match pipeline/sources/<id>.json. A 404 or a
      # hash mismatch is never retried. The provinces come from the pipeline's own registry, so
      # a newly registered province is acquired without editing this file.
      - name: Acquire every registered province and the inventory (hash checked)
        run: |
          for source in $(python -c "from cantre_pipeline.provinces import PROVINCES; print(' '.join(sorted(PROVINCES)))") tc-gci; do
            python -m cantre_pipeline acquire --source "$source"
          done
      - name: Build the national snapshot
        run: python -m cantre_pipeline national --out build/national --check-budget
      - name: Build the app for the /cantre-research/ sub-path
        run: npm run -w app build -- --base /cantre-research/
      - name: Lay the site out (app, then data/ from the national build)
        run: |
          mkdir -p build/site
          cp -r app/dist/. build/site/
          python pipeline/scripts/lay_out_site_data.py build/national build/site
      - name: Size gate
        run: node scripts/check-budget.mjs --dir build/site --tiles build/national/build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      # The data client hashes the bytes it receives and rejects a length mismatch, so the host
      # must send each .gz file as stored. If it adds Content-Encoding the browser unzips the
      # body first and the app cannot install its data. This runs after the site is live: a
      # failure here means the live app cannot download its data, so fix or roll back at once.
      # (Behaviour of GitHub Pages is not assumed: this step is the first evidence.)
      - name: The host serves the data files as stored (no Content-Encoding)
        env:
          SITE: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${SITE%/}"
          fetch_headers() { curl -sSI --retry 6 --retry-delay 10 --retry-all-errors "$@"; }
          echo "--- data/manifest.json"
          manifest_headers="$(fetch_headers "$base/data/manifest.json")"
          echo "$manifest_headers"
          if echo "$manifest_headers" | grep -qi '^content-encoding:'; then
            echo "::error::data/manifest.json is served with Content-Encoding"; exit 1
          fi
          curl -sS --retry 6 --retry-delay 10 --retry-all-errors "$base/data/manifest.json" -o manifest.json
          for key in snapshot assetDetails; do
            path="$(jq -r ".$key.path" manifest.json)"
            want_sha="$(jq -r ".$key.sha256" manifest.json)"
            want_bytes="$(jq -r ".$key.gzipBytes" manifest.json)"
            echo "--- data/$path"
            headers="$(fetch_headers -H 'Accept-Encoding: gzip, deflate, br' "$base/data/$path")"
            echo "$headers"
            if echo "$headers" | grep -qi '^content-encoding:'; then
              echo "::error::data/$path is served with Content-Encoding"; exit 1
            fi
            # The bytes a browser receives (same Accept-Encoding, no decoding) must be the file.
            curl -sS --retry 6 --retry-delay 10 --retry-all-errors \
              -H 'Accept-Encoding: gzip, deflate, br' "$base/data/$path" -o served.bin
            got_sha="$(sha256sum served.bin | cut -d' ' -f1)"
            got_bytes="$(wc -c < served.bin | tr -d ' ')"
            if [ "$got_sha" != "$want_sha" ] || [ "$got_bytes" != "$want_bytes" ]; then
              echo "::error::data/$path differs from the manifest: $got_bytes bytes sha256 $got_sha"; exit 1
            fi
            echo "data/$path matches the manifest ($got_bytes bytes)"
          done
